version: "3.8"

services:
  web:
    build: .
    container_name: ccs_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SQLALCHEMY_DATABASE_URI=sqlite:///instance/ccs.db
      - SECRET_KEY=dev-secret-key-change-in-prod
    volumes:
      - ./src/instance:/app/src/instance