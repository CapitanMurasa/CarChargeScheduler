{% extends "admin_index.html" %}

{% block content %}

<table>
    <tr>
      <th>station id</th>
      <th>station address</th>
      <th>id channel</th>
      <th>id user</th>
      <th>aditional tip</th>
    </tr>
    <form action="/admin/reported_users", method="post">
      {% for i in reported_users_list %}
      <tr>
          <td><input type="checkbox" name="table" value="{{ i.id }}">{{ i.station_id }}</td>
          <td>{{i.station_address}}</td>
          <td>{{i.id_channel}}</td>
          <td>{{i.id_user}}</td>
          <td>{{i.additional_tip}}</td>
      </tr>
      {% endfor %}
      <tr>
          <td><input type="submit" name="button" value="remove"></td>
      </tr>
    </form>
  </table>
{% endblock %}
